# Uygulama portu - README'de 3000 isteniyor
server.port=${PORT:3000}

# PostgreSQL bağlantısı
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/twitter_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:hello}

# Virgülle ayrılmış frontend adresleri (Vercel production + preview adresleri için)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3200,http://localhost:5173}

# JPA ayarları
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
